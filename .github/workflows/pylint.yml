name: Pylint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      # 설정은 .pylintrc를 따른다.
      # --fail-under=9.0 : 점수가 9점 아래로 떨어지면 실패시킨다.
      - name: Run pylint
        run: pylint app.py database.py gemini_parser.py seed.py --fail-under=9.0

      # Gemini는 가짜로 대체하고 임시 DB를 쓰므로 API 키 없이 돈다 (tests/conftest.py)
      - name: Run tests
        run: python -m pytest -q
